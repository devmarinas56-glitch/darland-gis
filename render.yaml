services:
  - type: web
    name: darland-gis
    env: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: APP_NAME
        value: DarLand GIS
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: true
      - key: APP_URL
        value: https://darland-gis.onrender.com
      - key: APP_KEY
        value: base64:DCCfl/sSl5AcfR1mdraNy7B0i9+Y8YfCkjSqnucF6OM=
      - key: SESSION_DRIVER
        value: file
      - key: SESSION_SECURE_COOKIE
        value: false
      - key: CACHE_STORE
        value: file
      - key: QUEUE_CONNECTION
        value: sync
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        fromDatabase:
          name: darland-database
          property: host
      - key: DB_PORT
        fromDatabase:
          name: darland-database
          property: port
      - key: DB_DATABASE
        fromDatabase:
          name: darland-database
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: darland-database
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: darland-database
          property: password

databases:
  - name: darland-database
    databaseName: darland_gis
    user: darland_user
