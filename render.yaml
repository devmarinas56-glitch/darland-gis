services:
  - type: web
    name: darland-gis
    env: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: APP_NAME
        value: DarLand GIS
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_URL
        value: https://darland-gis.onrender.com
      - key: APP_KEY
        value: base64:DCCfl/sSl5AcfR1mdraNy7B0i9+Y8YfCkjSqnucF6OM=
      - key: SESSION_DRIVER
        value: file
      - key: SESSION_LIFETIME
        value: 120
      - key: SESSION_SECURE_COOKIE
        value: true
      - key: CACHE_STORE
        value: file
      - key: QUEUE_CONNECTION
        value: sync

      # ── Neon PostgreSQL (DarLand) ────────────────────────────────
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        value: ep-wandering-moon-b4fljr7p.c-6.us-east-2.aws.neon.tech
      - key: DB_PORT
        value: "5432"
      - key: DB_DATABASE
        value: darland
      - key: DB_USERNAME
        value: neondb_owner
      - key: DB_PASSWORD
        value: npg_NoCrYm5S7igG
      - key: DB_SSLMODE
        value: require
